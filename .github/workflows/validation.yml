name: Public repository validation
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
      - run: python -m pip install -r environment/requirements-validation.txt
      - run: python scripts/workflow.py check
